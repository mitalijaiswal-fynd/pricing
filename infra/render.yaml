# Render Blueprint — Pricing app (FastAPI + Vite/React SPA)
#
# Database: Render Postgres (`pricing-db`). DATABASE_URL is injected from the instance.
#
# Deploy: Render Dashboard → New → Blueprint → repo → Blueprint path: infra/render.yaml
#
# Optional: To use an external Postgres instead, remove `databases:` and replace DATABASE_URL
# below with sync: false and set the URI in the dashboard.
#
# Docs: https://render.com/docs/infrastructure-as-code

databases:
  - name: pricing-db
    databaseName: pricing
    user: pricing
    region: oregon
    plan: free

services:
  - type: web
    name: pricing-api
    runtime: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: DATABASE_URL
        fromDatabase:
          name: pricing-db
          property: connectionString

  # Static sites are served globally (CDN); `region` is not supported here.
  - type: web
    name: pricing-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: ./frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          name: pricing-api
          type: web
          envVarKey: RENDER_EXTERNAL_URL
