# Render Blueprint (Option A) — Deploy API + Postgres + static frontend in one go.
#
# 1. Dashboard: New → Blueprint → Connect this Git repo.
# 2. Render detects `render.yaml` at the repo root automatically (no path override needed).
# 3. Apply. You get:
#    - pricing-db (Postgres)
#    - pricing-api (FastAPI) → https://pricing-api-….onrender.com
#    - pricing-web (Vite SPA) → https://pricing-web-….onrender.com  ← open this in the browser
#
# VITE_API_URL is wired from the API URL. After the first deploy, if the static site was built
# before the API URL existed: redeploy `pricing-web` (Clear build cache optional).
#
# External Postgres instead of Render’s DB: remove `databases:` and set DATABASE_URL with sync: false.
#
# Docs: https://render.com/docs/infrastructure-as-code

databases:
  - name: pricing-db
    databaseName: pricing
    user: pricing
    region: oregon
    plan: free

services:
  - type: web
    name: pricing-api
    runtime: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: DATABASE_URL
        fromDatabase:
          name: pricing-db
          property: connectionString

  # Static sites are global CDN — no `region` field.
  - type: web
    name: pricing-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    # Relative to rootDir (see https://render.com/docs/monorepo-support); not ./frontend/dist.
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          name: pricing-api
          type: web
          envVarKey: RENDER_EXTERNAL_URL
